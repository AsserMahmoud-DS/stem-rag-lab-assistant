[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stem-rag-lab-assistant"
version = "0.1.0"
description = "Hybrid+Graph RAG for educational engineering content"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.5.0",
    "lightrag-hku>=1.5.4",
    "llama-index>=0.14.16",
    "llama-index-embeddings-huggingface>=0.7.0",
    "llama-index-llms-groq>=0.5.0",
    "llama-index-retrievers-bm25>=0.7.1",
    "opendataloader-pdf[hybrid]>=2.4.7",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "torchaudio==2.6.0",
    "trulens-core>=2.14,<3",
    "trulens-feedback>=2.14,<3",
    "trulens-providers-litellm>=2.14,<3",
]



[tool.hatch.build.targets.wheel]
packages = ["src/stem_rag_lab_assistant"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: hits external services (e.g. Groq) or heavy local models; opt in explicitly",
]
